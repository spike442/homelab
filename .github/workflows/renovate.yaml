---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate
on:
  push:
    branches:
    - main
    paths:
    - .renovaterc.json5
    - .renovate/**.json5
  schedule:
  - cron: 0 * * * *
  repository_dispatch:
    types:
    - sentinel-release
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: info
        options:
        - debug
        - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
    - name: Generate Token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ secrets.BOT_APP_ID }}
        private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        token: ${{ steps.app-token.outputs.token }}

    - name: Setup Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: "24"

    - name: Validate Renovate configuration
      run: npm_config_loglevel=error npx --yes --package renovate@latest -- renovate-config-validator .renovaterc.json5

    - name: Run Renovate
      uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
      env:
        LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        RENOVATE_AUTODISCOVER: true
        RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
        RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
        RENOVATE_INTERNAL_CHECKS_FILTER: strict
        RENOVATE_PLATFORM: github
        RENOVATE_PLATFORM_COMMIT: true
      with:
        token: ${{ steps.app-token.outputs.token }}
        renovate-version: ${{ inputs.version || 'latest' }}
