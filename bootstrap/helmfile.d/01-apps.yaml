---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  timeout: 600

bases:
- default.yaml

defaultInherit: default

releases:
- name: cilium
  namespace: kube-system
  wait: false
  waitForJobs: false

- name: coredns
  namespace: kube-system
  needs:
  - kube-system/cilium

- name: cert-manager
  namespace: cert-manager
  needs:
  - kube-system/coredns

- name: external-secrets
  namespace: external-secrets
  needs:
  - cert-manager/cert-manager

- name: onepassword
  namespace: external-secrets
  hooks:
  # Wait for ExternalSecrets CRDs to be available
  - command: bash
    args:
    - -c
    - until kubectl get crd clustersecretstores.external-secrets.io &>/dev/null; do sleep 5; done
    events:
    - postsync
    showlogs: true
  # Apply ExternalSecret Resources
  - command: kubectl
    args:
    - apply
    - --server-side
    - --field-manager=kustomize-controller
    - --filename=../../kubernetes/apps/external-secrets/onepassword/app/clustersecretstore.yaml
    events:
    - postsync
    showlogs: true
  needs:
  - external-secrets/external-secrets

- name: kopiur
  namespace: backups
  takeOwnership: true
  needs:
  - external-secrets/onepassword

- name: flux-operator
  namespace: flux-system
  needs:
  - external-secrets/onepassword

- name: flux-instance
  namespace: flux-system
  needs:
  - flux-system/flux-operator
