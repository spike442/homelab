---
- name: Install local infra
  hosts: pihole
  any_errors_fatal: true
  become: false
  gather_facts: true

  pre_tasks:
    - name: Pausing for 2 seconds...
      ansible.builtin.pause:
        seconds: 2

  roles:
    - role: pihole

  tasks:
    - name: Verify the TrueNAS Docker daemon is available
      ansible.builtin.command:
        cmd: docker info
      become: true
      changed_when: false

    - name: Deploy and start the Pi-hole Compose project
      community.docker.docker_compose_v2:
        project_src: "{{ pihole_root }}"
        state: present
      register: compose_output
      become: true

    - name: Show docker compose results
      ansible.builtin.debug:
        var: compose_output

    - name: Enable dnsmasq.d directory loading
      ansible.builtin.command:
        cmd: docker exec pihole pihole-FTL --config misc.etc_dnsmasq_d true
      become: true
      changed_when: false

    - name: Reload pihole DNS
      ansible.builtin.command:
        cmd: docker exec pihole pihole reloaddns
      become: true
