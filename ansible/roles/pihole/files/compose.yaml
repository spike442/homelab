---
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    networks:
      - dns
    environment:
      FTLCONF_dns_listeningMode: "ALL"
      PIHOLE_DNS_: "1.1.1.1;1.0.0.1;8.8.8.8;8.8.4.4"
    volumes:
      - "/mnt/oasis/Appdata/pihole/dnsmasq.d:/etc/dnsmasq.d"
      - "/mnt/oasis/Appdata/pihole/etc-pihole:/etc/pihole"
    restart: unless-stopped

networks:
  dns:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
