apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka
  namespace: messaging
spec:
  dependsOn:
  - name: openebs
    namespace: storage
  healthChecks:
  - apiVersion: kafka.strimzi.io/v1
    kind: Kafka
    name: kafka
    namespace: messaging
  interval: 1h
  path: ./kubernetes/apps/messaging/kafka/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka-backup
  namespace: messaging
spec:
  dependsOn:
  - name: kafka
    namespace: messaging
  - name: kopiur
    namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/messaging/kafka/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: false
