# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strimzi
  namespace: messaging
spec:
  interval: 1h
  path: ./kubernetes/apps/messaging/kafka/operator
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
  targetNamespace: messaging
  wait: true
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: strimzi
    namespace: messaging
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka
  namespace: messaging
spec:
  dependsOn:
  - name: strimzi
    namespace: messaging
  - name: openebs
    namespace: storage
  healthChecks:
  - apiVersion: kafka.strimzi.io/v1
    kind: Kafka
    name: kafka
    namespace: messaging
  interval: 1h
  path: ./kubernetes/apps/messaging/kafka/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka-backup
  namespace: messaging
spec:
  dependsOn:
  - name: kafka
    namespace: messaging
  - name: kopiur
    namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/messaging/kafka/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: false
