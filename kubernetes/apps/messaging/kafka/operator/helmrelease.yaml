apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi
spec:
  chartRef:
    kind: OCIRepository
    name: strimzi
  interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    watchNamespaces:
    - messaging
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi
