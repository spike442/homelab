apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kafka-data
  namespace: messaging
spec:
  copyMethod: Direct
  credentialProjection:
    enabled: true
  mover:
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
      - 65532
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  repository:
    kind: ClusterRepository
    name: nas-primary
  sources:
  - pvc:
      name: data-0-kafka-kafka-0
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kafka-data-hourly
  namespace: messaging
spec:
  policyRef:
    name: kafka-data
  schedule:
    cron: "H * * * *"
    jitter: 15m
    runOnCreate: true
