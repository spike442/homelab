apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi
spec:
  chart:
    spec:
      chart: strimzi-kafka-operator
      sourceRef:
        kind: HelmRepository
        name: strimzi
      version: 1.2.0
  interval: 1h
  values:
    watchNamespaces:
    - messaging
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        memory: 384Mi
