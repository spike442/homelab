apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
    - name: internal
      port: 9093
      type: internal
      tls: false
      authentication:
        type: scram-sha-512
    - name: alertmanager
      port: 9094
      type: internal
      tls: false
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
      # Alertmanager's native event recorder supports TLS, but not SASL/SCRAM.
      # Its dedicated internal listener is limited to the alert topic below.
      allow.everyone.if.no.acl.found: true
    authorization:
      type: simple
  entityOperator:
    topicOperator: {}
    userOperator: {}
