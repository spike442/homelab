apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: temporal
        password: "{{ .DATABASE_PASSWORD }}"
  data:
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: temporal
      property: DATABASE_PASSWORD
