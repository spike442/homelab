apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temporal
  namespace: messaging
spec:
  groups:
  - name: temporal-server
    rules:
    - alert: TemporalFrontendErrorRate
      expr: |
        sum(rate(service_errors{service_name="frontend"}[5m]))
        /
        clamp_min(sum(rate(service_requests{service_name="frontend"}[5m])), 1)
        > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Temporal frontend request error rate is elevated
        description: More than 5% of Temporal frontend requests have failed for 10 minutes.
    - alert: TemporalPersistenceErrors
      expr: sum(rate(persistence_errors[5m])) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Temporal persistence is reporting errors
        description: Temporal has continuously reported persistence errors for 5 minutes.
    - alert: TemporalHiveWorkflowFailures
      expr: sum(increase(workflow_failed{operation="CompletionStats",namespace="hive"}[15m])) > 0
      labels:
        severity: warning
      annotations:
        summary: A Hive Temporal workflow failed
        description: At least one workflow in the Hive namespace failed during the last 15 minutes.
