apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-database
  namespace: messaging
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: database
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/messaging/temporal/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-database-secret
  namespace: messaging
spec:
  dependsOn:
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/messaging/temporal/database/secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal
  namespace: messaging
spec:
  dependsOn:
  - name: temporal-database
    namespace: messaging
  - name: temporal-database-secret
    namespace: messaging
  interval: 1h
  path: ./kubernetes/apps/messaging/temporal/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: true
