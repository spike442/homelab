---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  chartRef:
    kind: OCIRepository
    name: headlamp
  interval: 1h
  values:
    controllers:
      headlamp:
        containers:
          app:
            image:
              repository: ghcr.io/headlamp-k8s/headlamp
              tag: v0.44.0
            args:
            - -in-cluster
            - -plugins-dir=/headlamp/plugins
            env:
              HEADLAMP_CONFIG_METRICS_ENABLED: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4466
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
    service:
      app:
        controller: headlamp
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.homelab.com/enabled: "false"
        hostnames:
        - headlamp.timcasa.me
        parentRefs:
        - name: envoy-internal
          namespace: network
        rules:
        - backendRefs:
          - identifier: app
            port: *port
    rbac:
      roles:
        headlamp-view:
          type: ClusterRole
          rules:
          - apiGroups: [""]
            resources:
            - configmaps
            - endpoints
            - events
            - namespaces
            - nodes
            - persistentvolumeclaims
            - pods
            - pods/log
            - resourcequotas
            - replicationcontrollers
            - services
            verbs: ["get", "list", "watch"]
          - apiGroups: ["apps"]
            resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["batch"]
            resources: ["cronjobs", "jobs"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses", "networkpolicies"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gatewayclasses", "gateways", "httproutes"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["metrics.k8s.io"]
            resources: ["nodes", "pods"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["persistentvolumes", "storageclasses"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch"]
      bindings:
        headlamp-view:
          type: ClusterRoleBinding
          roleRef:
            identifier: headlamp-view
          subjects:
          - identifier: headlamp
    serviceAccount:
      headlamp: {}
