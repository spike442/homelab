---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

alerting:
  telegram:
    token: ${GATUS_TELEGRAM_TOKEN}
    id: 8580477808
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus

endpoints:
  - name: TrueNAS
    group: external
    url: http://192.168.1.17
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        description: TrueNAS is down

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/13041487
  link: https://github.com/spike442
  buttons:
  - name: Github
    link: https://github.com/spike442

web:
  port: ${GATUS_WEB_PORT}
