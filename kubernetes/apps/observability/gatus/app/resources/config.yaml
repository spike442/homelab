---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

alerting:
  custom:
    url: http://alertmanager-operated.observability.svc.cluster.local:9093/api/v2/alerts
    method: POST
    headers:
      Content-Type: application/json
    default-alert:
      description: Gatus endpoint health check failed
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
    body: |
      [{
        "labels": {
          "alertname": "GatusEndpointAlert",
          "source": "gatus",
          "endpoint_group": "[ENDPOINT_GROUP]",
          "endpoint_name": "[ENDPOINT_NAME]",
          "severity": "critical"
        },
        "annotations": {
          "summary": "Gatus endpoint [ENDPOINT_NAME] is [ALERT_TRIGGERED_OR_RESOLVED]",
          "description": "[ALERT_DESCRIPTION] URL=[ENDPOINT_URL]"
        }
      }]

endpoints:
  - name: TrueNAS
    group: external
    url: http://192.168.1.17
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: TrueNAS is down
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/13041487
  link: https://github.com/spike442
  buttons:
  - name: Github
    link: https://github.com/spike442

web:
  port: ${GATUS_WEB_PORT}
