---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

alerting:
  custom:
    url: http://anton.agents.svc.cluster.local:8080/webhooks/alerts?source=gatus
    method: POST
    headers:
      Content-Type: application/json
      Authorization: "Bearer ${GATUS_ALERT_TOKEN}"
    default-alert:
      description: Gatus endpoint health check failed
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
    body: |
      {
        "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
        "endpoint_group": "[ENDPOINT_GROUP]",
        "endpoint_name": "[ENDPOINT_NAME]",
        "endpoint_url": "[ENDPOINT_URL]",
        "description": "[ALERT_DESCRIPTION]"
      }

endpoints:
  - name: TrueNAS
    group: external
    url: http://192.168.1.17
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: TrueNAS is down
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/13041487
  link: https://github.com/spike442
  buttons:
  - name: Github
    link: https://github.com/spike442

web:
  port: ${GATUS_WEB_PORT}
