apiVersion: v1
kind: Secret
metadata:
  name: alertmanager
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: sentinel
      group_by:
      - '...'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
      - receiver: 'null'
        matchers:
        - alertname =~ "Watchdog|InfoInhibitor"

    inhibit_rules:
    - equal:
      - alertname
      - namespace
      source_matchers:
      - severity = critical
      target_matchers:
      - severity = warning

    receivers:
    - name: 'null'
    - name: sentinel
      webhook_configs:
      - url: http://sentinel-api.agents.svc.cluster.local:8070/api/events/alertmanager
        send_resolved: true
