apiVersion: v1
kind: Secret
metadata:
  name: alertmanager
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: null
      repeat_interval: 12h
      group_by:
      - alertname
      - cluster
      - job
      group_interval: 5m
      group_wait: 1m

    inhibit_rules:
    - equal:
      - alertname
      - namespace
      source_matchers:
      - severity = critical
      target_matchers:
      - severity = warning

    receivers:
    - name: null

    event_recorder:
      kafka_outputs:
      - name: hive
        brokers:
        - kafka-kafka-bootstrap.messaging.svc.cluster.local:9094
        topic: hive.alerts
        format: json
        acks: all
