apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sre-alertmanager
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: anton
      property: ALERTMANAGER_TOKEN
