---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: anton
    repeatInterval: 12h
    groupBy:
    - alertname
    - cluster
    - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
  - equal:
    - alertname
    - namespace
    sourceMatch:
    - name: severity
      value: critical
      matchType: =
    targetMatch:
    - name: severity
      value: warning
      matchType: =

  receivers:
  - name: anton
    webhookConfigs:
    - url: http://anton.agents.svc.cluster.local:8080/webhooks/alerts?source=alertmanager
      sendResolved: true
      httpConfig:
        bearerTokenSecret:
          name: sre-alertmanager
          key: token
