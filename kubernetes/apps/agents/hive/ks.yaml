apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hive-db
  namespace: agents
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: database
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/agents/hive/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hive-messaging
  namespace: agents
spec:
  dependsOn:
  - name: kafka
    namespace: messaging
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/agents/hive/kafka
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: messaging
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hive
  namespace: agents
spec:
  dependsOn:
  - name: hive-db
    namespace: agents
  - name: hive-messaging
    namespace: agents
  - name: temporal
    namespace: messaging
  interval: 1h
  path: ./kubernetes/apps/agents/hive/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: true
