apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-kafka-password
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hive-kafka-password
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: hive
      property: KAFKA_PASSWORD
