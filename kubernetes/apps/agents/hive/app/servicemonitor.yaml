apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hive-temporal-worker
  namespace: agents
spec:
  namespaceSelector:
    matchNames:
    - agents
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
