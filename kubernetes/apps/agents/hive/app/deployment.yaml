apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: agents
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/part-of: hive
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/part-of: hive
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hive
        image: ghcr.io/spike442/hive:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8070
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        env:
        - name: HIVE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: CONTROL_TOKEN
        - name: HIVE_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: HIVE_DATABASE_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
