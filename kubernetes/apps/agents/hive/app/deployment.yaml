apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: agents
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/part-of: hive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/part-of: hive
    spec:
      serviceAccountName: hive
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hive
        image: ghcr.io/spike442/hive:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8070
        - name: metrics
          containerPort: 9091
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        env:
        - name: HIVE_RAG_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: RAG_S3_ACCESS_KEY_ID
        - name: HIVE_RAG_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: RAG_S3_SECRET_ACCESS_KEY
        - name: HIVE_RAG_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: RAG_OPENAI_API_KEY
        - name: HOME
          value: /home/hive
        - name: HIVE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: CONTROL_TOKEN
        - name: HIVE_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: HIVE_DATABASE_PASSWORD
        - name: HIVE_DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: DISCORD_WEBHOOK_URL
        - name: HIVE_KAFKA_USERNAME
          value: hive
        - name: HIVE_KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: KAFKA_PASSWORD
        - name: HIVE_GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: GITHUB_APP_ID
        - name: HIVE_GITHUB_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: GITHUB_INSTALLATION_ID
        - name: HIVE_GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: hive-secrets
              key: GITHUB_APP_PRIVATE_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/hive
        - name: ssh
          mountPath: /home/hive/.ssh
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: ssh
        projected:
          sources:
          - secret:
              name: hive-secrets
              items:
              - key: GITHUB_SSH_PRIVATE_KEY
                path: id_ed25519
                mode: 0440
          - configMap:
              name: hive-known-hosts
              items:
              - key: known_hosts
                path: known_hosts
                mode: 0444
              - key: config
                path: config
                mode: 0444
