apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
configMapGenerator:
- name: hive-known-hosts
  files:
  - known_hosts=ssh/known_hosts
  - config=ssh/config
  options:
    disableNameSuffixHash: true

resources:
- ./serviceaccount.yaml
- ./clusterrole.yaml
- ./clusterrolebinding.yaml
- ./deployment.yaml
- ./service.yaml
- ./servicemonitor.yaml
- ./prometheusrule.yaml
- ./grafanadashboard.yaml
- ./httproute.yaml
- ./externalsecret.yaml
