apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hive-temporal-worker
  namespace: agents
spec:
  groups:
  - name: hive-temporal-worker
    rules:
    - alert: HiveTemporalWorkflowTaskWait
      expr: |
        histogram_quantile(
          0.95,
          sum by (le, task_queue) (
            rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket{namespace="hive"}[5m])
          )
        ) > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Hive Temporal workflow tasks are waiting for workers
        description: The p95 workflow task schedule-to-start latency has exceeded 10 seconds for 10 minutes.
    - alert: HiveTemporalActivityTaskWait
      expr: |
        histogram_quantile(
          0.95,
          sum by (le, task_queue) (
            rate(temporal_activity_schedule_to_start_latency_seconds_bucket{namespace="hive"}[5m])
          )
        ) > 30
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Hive Temporal activities are waiting for workers
        description: The p95 activity schedule-to-start latency has exceeded 30 seconds for 10 minutes.
    - alert: HiveTemporalWorkerActivitySlotsExhausted
      expr: min by (task_queue) (temporal_worker_task_slots_available{namespace="hive",worker_type="ActivityWorker"}) == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Hive Temporal worker has no free activity slots
        description: All activity worker slots have been exhausted for 5 minutes.
