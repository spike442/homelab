apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hive-secrets
    creationPolicy: Owner
  data:
  - secretKey: RAG_S3_ACCESS_KEY_ID
    remoteRef:
      key: hive
      property: RAG_S3_ACCESS_KEY_ID
  - secretKey: RAG_S3_SECRET_ACCESS_KEY
    remoteRef:
      key: hive
      property: RAG_S3_SECRET_ACCESS_KEY
  - secretKey: RAG_OPENAI_API_KEY
    remoteRef:
      key: hive
      property: RAG_OPENAI_API_KEY
  - secretKey: CONTROL_TOKEN
    remoteRef:
      key: hive
      property: CONTROL_TOKEN
  - secretKey: HIVE_DATABASE_PASSWORD
    remoteRef:
      key: hive
      property: DATABASE_PASSWORD
  - secretKey: DISCORD_WEBHOOK_URL
    remoteRef:
      key: hive
      property: DISCORD_WEBHOOK_URL
  - secretKey: KAFKA_PASSWORD
    remoteRef:
      key: hive
      property: KAFKA_PASSWORD
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: hive
      property: GITHUB_APP_ID
  - secretKey: GITHUB_INSTALLATION_ID
    remoteRef:
      key: hive
      property: GITHUB_INSTALLATION_ID
  - secretKey: GITHUB_APP_PRIVATE_KEY
    remoteRef:
      key: hive
      property: GITHUB_APP_PRIVATE_KEY
  - secretKey: GITHUB_SSH_PRIVATE_KEY
    remoteRef:
      key: hive
      property: GITHUB_SSH_PRIVATE_KEY
      decodingStrategy: Base64
