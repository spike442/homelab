apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hive-secrets
    creationPolicy: Owner
  data:
  - secretKey: CONTROL_TOKEN
    remoteRef:
      key: hive
      property: CONTROL_TOKEN
  - secretKey: HIVE_DATABASE_PASSWORD
    remoteRef:
      key: hive
      property: DATABASE_PASSWORD
