apiVersion: v1
kind: ConfigMap
metadata:
  name: anton-kubeconfig
  namespace: agents
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        server: https://kubernetes.default.svc
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
    - name: anton
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
    - name: anton
      context:
        cluster: in-cluster
        user: anton
        namespace: agents
    current-context: anton
