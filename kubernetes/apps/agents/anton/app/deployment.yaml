apiVersion: apps/v1
kind: Deployment
metadata:
  name: anton
  namespace: agents
  labels:
    app.kubernetes.io/name: anton
    app.kubernetes.io/part-of: homelab-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anton
        app.kubernetes.io/part-of: agents
    spec:
      serviceAccountName: anton
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: anton
        image: ghcr.io/spike442/anton:sha-abbe43e5c0837e50986bc778511af282827abc57
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        env:
        - name: ANTON_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: LLM_API_KEY
        - name: ANTON_GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: GITHUB_APP_ID
        - name: ANTON_GITHUB_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: GITHUB_INSTALLATION_ID
        - name: ANTON_GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: GITHUB_APP_PRIVATE_KEY
        - name: ANTON_ALERTMANAGER_TOKEN
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: ALERTMANAGER_TOKEN
        - name: ANTON_TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: TELEGRAM_BOT_TOKEN
        - name: ANTON_TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: TELEGRAM_CHAT_ID
        - name: ANTON_S3__ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: S3_ACCESS_KEY_ID
        - name: ANTON_S3__SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: anton-secrets
              key: S3_SECRET_ACCESS_KEY
        - name: HOME
          value: /home/anton
        - name: KUBECONFIG
          value: $(HOME)/.kube/config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: ssh
          mountPath: /home/anton/.ssh
          readOnly: true
        - name: kubeconfig
          mountPath: /home/anton/.kube
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /data
      volumes:
      - name: ssh
        projected:
          sources:
          - secret:
              name: anton-secrets
              items:
              - key: GITHUB_SSH_PRIVATE_KEY
                path: id_ed25519
                mode: 0400
          - configMap:
              name: anton-known-hosts
              items:
              - key: known_hosts
                path: known_hosts
                mode: 0444
              - key: config
                path: config
                mode: 0444
      - name: tmp
        emptyDir: {}
      - name: kubeconfig
        configMap:
          name: anton-kubeconfig
          items:
          - key: config
            path: config
      - name: state
        persistentVolumeClaim:
          claimName: anton-state
