apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anton
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: anton-secrets
    creationPolicy: Owner
  data:
  - secretKey: LLM_API_KEY
    remoteRef:
      key: anton
      property: LLM_API_KEY
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: anton
      property: GITHUB_APP_ID
  - secretKey: GITHUB_INSTALLATION_ID
    remoteRef:
      key: anton
      property: GITHUB_INSTALLATION_ID
  - secretKey: GITHUB_APP_PRIVATE_KEY
    remoteRef:
      key: anton
      property: GITHUB_APP_PRIVATE_KEY
  - secretKey: GITHUB_SSH_PRIVATE_KEY
    remoteRef:
      key: anton
      property: GITHUB_SSH_PRIVATE_KEY
      decodingStrategy: Base64
  - secretKey: ALERT_TOKEN
    remoteRef:
      key: anton
      property: ALERT_TOKEN
  - secretKey: DISCORD_WEBHOOK_URL
    remoteRef:
      key: anton
      property: DISCORD_WEBHOOK_URL
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: anton
      property: S3_ACCESS_KEY_ID
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: anton
      property: S3_SECRET_ACCESS_KEY
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: anton
      property: DATABASE_PASSWORD
