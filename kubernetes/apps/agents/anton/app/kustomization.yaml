apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents

configMapGenerator:
- name: anton-known-hosts
  files:
  - known_hosts=ssh/known_hosts
  - config=ssh/config
  options:
    disableNameSuffixHash: true

resources:
- ./kubeconfig-configmap.yaml
- ./serviceaccount.yaml
- ./clusterrole.yaml
- ./clusterrolebinding.yaml
- ./deployment.yaml
- ./service.yaml
- ./pvc.yaml
- ./externalsecret.yaml
