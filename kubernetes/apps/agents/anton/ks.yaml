apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: anton
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/agents/anton/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: true
