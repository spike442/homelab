---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stonks
  namespace: agents
spec:
  dependsOn:
  - name: onepassword
    namespace: external-secrets
  - name: spark-operator
    namespace: datalakehouse
  - name: searxng
    namespace: agents
  interval: 1h
  path: ./kubernetes/apps/agents/stonks/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: true
