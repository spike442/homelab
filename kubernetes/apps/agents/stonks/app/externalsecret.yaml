---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stonks
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stonks-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        LLM_API_KEY: "{{ .LLM_API_KEY }}"
  dataFrom:
  - extract:
      key: stonks
