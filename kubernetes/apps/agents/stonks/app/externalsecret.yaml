---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stonks
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stonks-secrets
    template:
      data:
        LLM_API_KEY: "{{ .LLM_API_KEY }}"
  dataFrom:
  - extract:
      key: stonks
