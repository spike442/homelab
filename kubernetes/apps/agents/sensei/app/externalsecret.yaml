apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sensei
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sensei-secrets
    creationPolicy: Owner
  data:
  - secretKey: LLM_API_KEY
    remoteRef:
      key: sensei
      property: LLM_API_KEY
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: anton
      property: GITHUB_APP_ID
  - secretKey: GITHUB_INSTALLATION_ID
    remoteRef:
      key: anton
      property: GITHUB_INSTALLATION_ID
  - secretKey: GITHUB_APP_PRIVATE_KEY
    remoteRef:
      key: anton
      property: GITHUB_APP_PRIVATE_KEY
  - secretKey: CONTROL_TOKEN
    remoteRef:
      key: sensei
      property: CONTROL_TOKEN
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: sensei
      property: S3_ACCESS_KEY_ID
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: sensei
      property: S3_SECRET_ACCESS_KEY
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: sensei
      property: DATABASE_PASSWORD
