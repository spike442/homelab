apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-review
  namespace: agents
  labels:
    app.kubernetes.io/name: pr-review
    app.kubernetes.io/part-of: hive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-review
        app.kubernetes.io/part-of: hive
    spec:
      serviceAccountName: pr-review
      terminationGracePeriodSeconds: 960
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pr-review
        image: ghcr.io/spike442/pr-review:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8090
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        env:
        - name: HOME
          value: /home/pr-review
        - name: KUBECONFIG
          value: /home/pr-review/.kube/config
        - name: PR_REVIEW_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: pr-review-secrets
              key: LLM_API_KEY
        - name: PR_REVIEW_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: pr-review-secrets
              key: S3_ACCESS_KEY_ID
        - name: PR_REVIEW_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: pr-review-secrets
              key: S3_SECRET_ACCESS_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: kubeconfig
          mountPath: /home/pr-review/.kube
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: kubeconfig
        configMap:
          name: pr-review-kubeconfig
          items:
          - key: config
            path: config
