apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-review
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pr-review-secrets
    creationPolicy: Owner
  data:
  - secretKey: LLM_API_KEY
    remoteRef:
      key: pr-review
      property: LLM_API_KEY
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: pr-review
      property: S3_ACCESS_KEY_ID
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: pr-review
      property: S3_SECRET_ACCESS_KEY
