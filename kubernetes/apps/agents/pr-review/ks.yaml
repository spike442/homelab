apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pr-review
  namespace: agents
spec:
  dependsOn:
  - name: temporal
    namespace: messaging
  interval: 1h
  path: ./kubernetes/apps/agents/pr-review/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: true
