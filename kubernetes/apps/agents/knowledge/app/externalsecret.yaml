---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: knowledge-secrets
    template:
      data:
        CLICKHOUSE_PASSWORD: "{{ .CLICKHOUSE_PASSWORD }}"
  dataFrom:
  - extract:
      key: knowledge
