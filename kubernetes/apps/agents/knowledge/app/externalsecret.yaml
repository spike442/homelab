---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: knowledge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: knowledge-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLICKHOUSE_PASSWORD: "{{ .CLICKHOUSE_PASSWORD }}"
  dataFrom:
  - extract:
      key: knowledge
