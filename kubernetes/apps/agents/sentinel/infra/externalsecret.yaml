---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-db
  namespace: database
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: sentinel-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: sentinel
        password: "{{ .DATABASE_PASSWORD }}"
  data:
  - {secretKey: DATABASE_PASSWORD, remoteRef: {key: sentinel, property: DATABASE_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-knowledge-db
  namespace: database
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: sentinel-knowledge-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: sentinel_knowledge
        password: "{{ .KNOWLEDGE_DATABASE_PASSWORD }}"
  data:
  - {secretKey: KNOWLEDGE_DATABASE_PASSWORD, remoteRef: {key: sentinel, property: KNOWLEDGE_DATABASE_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-kafka-password
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: sentinel-kafka-password, creationPolicy: Owner}
  data:
  - {secretKey: password, remoteRef: {key: sentinel, property: KAFKA_PASSWORD}}
  - {secretKey: sre, remoteRef: {key: sentinel, property: KAFKA_SRE_PASSWORD}}
  - {secretKey: pr-review, remoteRef: {key: sentinel, property: KAFKA_PR_REVIEW_PASSWORD}}
  - {secretKey: executor, remoteRef: {key: sentinel, property: KAFKA_EXECUTOR_PASSWORD}}
