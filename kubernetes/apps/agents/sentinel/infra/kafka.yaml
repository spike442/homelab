---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  namespace: messaging
  name: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: sentinel-kafka-password
          key: password
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: sentinel.
        patternType: prefix
      operations: [Read, Write, Describe]
    - resource:
        type: group
        name: sentinel-
        patternType: prefix
      operations: [Read]

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  namespace: messaging
  name: sentinel-sre
  labels:
    app.kubernetes.io/name: sentinel
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: sentinel-kafka-password
          key: sre
  authorization:
    type: simple
    acls:
    - resource: {type: topic, name: sentinel.sre.commands, patternType: literal}
      operations: [Read, Describe]
    - resource: {type: topic, name: sentinel.sre.returns, patternType: literal}
      operations: [Write, Describe]
    - resource: {type: group, name: sentinel-incident, patternType: literal}
      operations: [Read]
    - resource: {type: topic, name: sentinel.pr-review.commands, patternType: literal}
      operations: [Read, Describe]
    - resource: {type: topic, name: sentinel.pr-review.returns, patternType: literal}
      operations: [Write, Describe]
    - resource: {type: group, name: sentinel-review, patternType: literal}
      operations: [Read]

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  namespace: messaging
  name: sentinel-executor
  labels:
    app.kubernetes.io/name: sentinel
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: sentinel-kafka-password
          key: executor
  authorization:
    type: simple
    acls:
    - resource: {type: topic, name: sentinel.executor.commands, patternType: literal}
      operations: [Read, Describe]
    - resource: {type: topic, name: sentinel.executor.returns, patternType: literal}
      operations: [Write, Describe]
    - resource: {type: group, name: sentinel-executor, patternType: literal}
      operations: [Read]
