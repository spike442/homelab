---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shed
spec:
  chartRef:
    kind: OCIRepository
    name: shed
  interval: 1h
  values:
    secret: shed-secrets
    postgres:
      host: postgres0-rw.database.svc.cluster.local
      database: sentinel
      user: sentinel
    kafka:
      bootstrapServers: kafka-kafka-bootstrap.messaging.svc.cluster.local:9093
      username: sentinel
      consumerGroup: sentinel
    annotations:
      reloader.stakater.com/auto: "true"
    route:
      hostname: sentinel.timcasa.me
      gatewayName: envoy-internal
      gatewayNamespace: network
