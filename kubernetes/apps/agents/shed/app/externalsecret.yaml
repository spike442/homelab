---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shed-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_PASSWORD: "{{ .DATABASE_PASSWORD }}"
        KAFKA_PASSWORD: "{{ .KAFKA_PASSWORD }}"
  dataFrom:
  - extract:
      key: shed
