---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shed
  namespace: agents
spec:
  dependsOn:
  - name: sentinel
    namespace: agents
  interval: 1h
  path: ./kubernetes/apps/agents/shed/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agents
  wait: true
