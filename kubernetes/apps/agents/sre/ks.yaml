apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sre-infra
  namespace: agents
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: database
  - name: kafka
    namespace: messaging
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/agents/sre/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sre
  namespace: agents
spec:
  dependsOn:
  - name: sre-infra
    namespace: agents
  - name: onepassword
    namespace: external-secrets
  - name: openebs
    namespace: storage
  - name: s3
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/agents/sre/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
