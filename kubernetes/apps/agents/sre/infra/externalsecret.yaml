---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-db
  namespace: database
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target:
    name: sre-db
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: sre
        password: "{{ .DATABASE_PASSWORD }}"
  data:
  - {secretKey: DATABASE_PASSWORD, remoteRef: {key: sre, property: DATABASE_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-kafka-password
  namespace: messaging
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: onepassword}
  target: {name: sre-kafka-password}
  data:
  - {secretKey: password, remoteRef: {key: sre, property: KAFKA_PASSWORD}}
  - {secretKey: worker, remoteRef: {key: sre, property: KAFKA_WORKER_PASSWORD}}
  - {secretKey: executor, remoteRef: {key: sre, property: KAFKA_EXECUTOR_PASSWORD}}
