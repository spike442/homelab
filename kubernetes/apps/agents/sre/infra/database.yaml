---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  labels:
    app.kubernetes.io/name: sre
  name: postgres0-sre
  namespace: database
spec:
  name: sre
  owner: sre
  cluster:
    name: postgres0

---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  labels:
    app.kubernetes.io/name: sre
  name: sre
  namespace: database
spec:
  cluster:
    name: postgres0
  name: sre
  login: true
  superuser: false
  passwordSecret:
    name: sre-db
