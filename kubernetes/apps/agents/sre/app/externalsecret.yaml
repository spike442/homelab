apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sre-secrets
    creationPolicy: Owner
  data:
  - secretKey: LLM_API_KEY
    remoteRef:
      key: sre
      property: LLM_API_KEY
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: sre
      property: S3_ACCESS_KEY_ID
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: sre
      property: S3_SECRET_ACCESS_KEY
