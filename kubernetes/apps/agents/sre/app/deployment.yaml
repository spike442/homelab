apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre
  namespace: agents
  labels:
    app.kubernetes.io/name: sre
    app.kubernetes.io/part-of: hive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre
        app.kubernetes.io/part-of: hive
    spec:
      serviceAccountName: sre
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sre
        image: ghcr.io/spike442/sre:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        env:
        - name: SRE_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: sre-secrets
              key: LLM_API_KEY
        - name: SRE_S3__ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: sre-secrets
              key: S3_ACCESS_KEY_ID
        - name: SRE_S3__SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: sre-secrets
              key: S3_SECRET_ACCESS_KEY
        - name: HOME
          value: /home/sre
        - name: KUBECONFIG
          value: $(HOME)/.kube/config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: kubeconfig
          mountPath: /home/sre/.kube
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: repo
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: repo
        emptyDir: {}
      - name: kubeconfig
        configMap:
          name: sre-kubeconfig
          items:
          - key: config
            path: config
