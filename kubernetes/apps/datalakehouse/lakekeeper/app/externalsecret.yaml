---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakekeeper
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lakekeeper-secret
    template:
      data:
        postgresql-password: "{{ .LAKEKEEPER_DB_PASSWORD }}"
        encryption-key: "{{ .LAKEKEEPER_ENCRYPTION_KEY }}"
  dataFrom:
  - extract:
      key: lakekeeper
