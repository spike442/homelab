---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakekeeper-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lakekeeper-db
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: lakekeeper
        password: "{{ .LAKEKEEPER_DB_PASSWORD }}"
  dataFrom:
  - extract:
      key: lakekeeper
