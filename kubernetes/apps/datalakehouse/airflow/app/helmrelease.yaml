---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
spec:
  interval: 1h
  chart:
    spec:
      chart: airflow
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
  valuesFrom:
  - kind: Secret
    name: airflow-secret
    valuesKey: admin-password
    targetPath: createUserJob.defaultUser.password
  install:
    remediation:
      retries: -1
  values:
    executor: KubernetesExecutor
    fernetKeySecretName: airflow-secret
    apiSecretKeySecretName: airflow-secret
    jwtSecretName: airflow-secret
    data:
      metadataSecretName: airflow-secret
    secret:
    - envName: AIRFLOW_CONN_S3_LOGS
      secretName: airflow-secret
      secretKey: s3-logs-connection
    env:
    - name: AIRFLOW_VAR_STONKS_VERSION
      # renovate: datasource=docker depName=ghcr.io/spike442/charts/shed/stonks
      value: "0.1.1"
    config:
      core:
        parallelism: 8
      api:
        workers: 1
      dag_processor:
        parsing_processes: 1
      logging:
        remote_logging: "True"
        remote_base_log_folder: s3://logs/airflow
        remote_log_conn_id: s3_logs
    migrateDatabaseJob:
      useHelmHooks: false
    createUserJob:
      useHelmHooks: false
      defaultUser:
        username: admin
        email: admin@timcasa.me
        firstName: Admin
        lastName: User
    apiServer:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 768Mi
        limits:
          memory: 1536Mi
    scheduler:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 640Mi
        limits:
          memory: 1Gi
    dagProcessor:
      resources:
        requests:
          cpu: 75m
          memory: 512Mi
        limits:
          memory: 1Gi
    triggerer:
      enabled: false
    workers:
      kubernetes:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
    postgresql:
      enabled: false
    redis:
      enabled: false
    statsd:
      enabled: false
    logs:
      persistence:
        enabled: false
    dags:
      persistence:
        enabled: false
      gitSync:
        enabled: true
        repo: https://github.com/spike442/shed.git
        ref: stonks-0.1.1
        branch: ""
        rev: ""
        depth: 1
        subPath: infra/stonks/airflow/dags
        period: 60s
