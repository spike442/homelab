---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: airflow-secret
    template:
      engineVersion: v2
      data:
        fernet-key: "{{ .AIRFLOW_FERNET_KEY }}"
        api-secret-key: "{{ .AIRFLOW_WEBSERVER_SECRET_KEY }}"
        jwt-secret: "{{ .AIRFLOW_JWT_SECRET }}"
        admin-password: "{{ .AIRFLOW_ADMIN_PASSWORD }}"
        connection: "postgresql://airflow:{{ .AIRFLOW_DB_PASSWORD }}@postgres0-rw.database.svc.cluster.local:5432/airflow"
        s3-logs-connection: '{"conn_type": "aws", "login": {{ .S3_ACCESS_KEY_ID | toJson }}, "password": {{ .S3_SECRET_ACCESS_KEY | toJson }}, "extra": {"endpoint_url": "http://rustfs-svc.storage.svc.cluster.local:9000", "region_name": "us-east-1"}}'
  data:
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: sentinel
      property: S3_ACCESS_KEY_ID
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: sentinel
      property: S3_SECRET_ACCESS_KEY
  dataFrom:
  - extract:
      key: airflow
