---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
spec:
  interval: 1h
  chart:
    spec:
      chart: trino
      version: "1.44.0"
      sourceRef:
        kind: HelmRepository
        name: trino
  valuesFrom:
  - kind: ConfigMap
    name: trino-catalog
    valuesKey: stonks.properties
    targetPath: catalogs.stonks
  values:
    server:
      workers: 0
      config:
        query:
          maxMemory: 1GB
    coordinator:
      jvm:
        maxHeapSize: 2G
      config:
        nodeScheduler:
          includeCoordinator: true
        query:
          maxMemoryPerNode: 1GB
      resources:
        requests: {cpu: 250m, memory: 3Gi}
        limits: {memory: 3Gi}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    envFrom:
    - secretRef:
        name: s3
