connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper.datalakehouse.svc.cluster.local:8181/catalog
iceberg.rest-catalog.warehouse=stonks
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://rustfs-svc.storage.svc.cluster.local:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_KEY}
