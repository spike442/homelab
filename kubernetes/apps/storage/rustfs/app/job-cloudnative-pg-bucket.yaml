---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init-cloudnative-pg-bucket
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.27.49
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -ec
            - |
              if aws --endpoint-url http://rustfs-svc:9000 s3api head-bucket --bucket cloudnative-pg; then
                echo "cloudnative-pg bucket already exists"
              else
                aws --endpoint-url http://rustfs-svc:9000 s3api create-bucket --bucket cloudnative-pg
                echo "cloudnative-pg bucket created"
              fi
