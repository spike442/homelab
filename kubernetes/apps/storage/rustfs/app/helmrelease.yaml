---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
spec:
  interval: 1h
  chart:
    spec:
      chart: rustfs
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: rustfs
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    replicaCount: 1
    mode:
      standalone:
        enabled: true
        existingClaim:
          dataClaim: rustfs
          logsClaim: rustfs
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs-secret
    config:
      rustfs:
        obs_environment: production
        obs_log_directory: ""
    service:
      type: ClusterIP
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
