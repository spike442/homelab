---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rustfs-secret
    template:
      engineVersion: v2
      data:
        RUSTFS_ACCESS_KEY: "{{ .RUSTFS_ACCESS_KEY }}"
        RUSTFS_SECRET_KEY: "{{ .RUSTFS_SECRET_KEY }}"
  dataFrom:
  - extract:
      key: rustfs
