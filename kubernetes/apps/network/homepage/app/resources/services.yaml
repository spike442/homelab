- Home Internet:
        - Home Connection:
                  icon: mdi-web
                  description: Public IP and approximate location
                  widget:
                    type: customapi
                    url: https://ipwho.is/?fields=success,ip,city,country
                    refreshInterval: 900000
                    mappings:
                      - field: ip
                        label: Public IP
                        format: text
                      - field: city
                        label: City
                        format: text
                      - field: country
                        label: Country
                        format: text
