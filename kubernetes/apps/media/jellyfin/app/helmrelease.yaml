---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    controllers:
      jellyfin:
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: 12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
            env:
              TZ: Europe/Paris
              JELLYFIN_PublishedServerUrl: http://192.168.1.220:8096
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: "4"
                memory: 5Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: jellyfin
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.1.220
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 8096
    route:
      app:
        hostnames:
        - jellyfin.timcasa.me
        parentRefs:
        - name: envoy-internal
          namespace: network
        rules:
        - backendRefs:
          - identifier: app
            port: 8096
    persistence:
      config:
        existingClaim: jellyfin
        globalMounts:
        - path: /config
      cache:
        type: emptyDir
        globalMounts:
        - path: /cache
      media:
        type: nfs
        server: 192.168.1.17
        path: /mnt/oasis/Media
        globalMounts:
        - path: /media
          readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
