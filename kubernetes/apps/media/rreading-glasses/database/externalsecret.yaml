---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rreading-glasses-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rreading-glasses-db
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: rreading-glasses
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
  - extract:
      key: rreading-glasses
