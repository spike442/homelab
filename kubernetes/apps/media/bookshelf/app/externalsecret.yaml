---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookshelf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookshelf-secret
    template:
      data:
        READARR__AUTH__APIKEY: "{{ .BOOKSHELF_API_KEY }}"
  dataFrom:
  - extract:
      key: bookshelf
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kindle
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kindle-secret
  dataFrom:
  - extract:
      key: kindle
