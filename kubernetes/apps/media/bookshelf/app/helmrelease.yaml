---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookshelf
spec:
  chartRef:
    kind: OCIRepository
    name: bookshelf
  interval: 1h
  values:
    controllers:
      bookshelf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: hardcover-v0.4.21.182@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
            env:
              PUID: "1000"
              PGID: "1000"
              METADATA_URL: http://rreading-glasses.media.svc.cluster.local:8788
              READARR__APP__INSTANCENAME: Bookshelf
              READARR__APP__THEME: dark
              READARR__AUTH__METHOD: External
              READARR__AUTH__REQUIRED: DisabledForLocalAddresses
              READARR__LOG__DBENABLED: "False"
              READARR__LOG__LEVEL: info
              READARR__SERVER__PORT: &port 8787
              TZ: Europe/Paris
            envFrom:
            - secretRef:
                name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
          sync-kindle:
            image: &kindle
              repository: ghcr.io/spike442/containers/kindle
              tag: 1.3.0
            command:
            - sync-kindle
            env:
              LIBRARY: /media/Books
              STATE: /data/sync-kindle.json
            envFrom: &kindleSecret
            - secretRef:
                name: kindle-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
          fetch-articles:
            image: *kindle
            command:
            - fetch-articles
            env:
              STATE: /data/fetch-articles.json
              FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local:8191
            envFrom: *kindleSecret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.1.215
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
        - "{{ .Release.Name }}.timcasa.me"
        parentRefs:
        - name: envoy-internal
          namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bookshelf:
            app:
            - path: /config
            sync-kindle:
            - path: /data
            fetch-articles:
            - path: /data
      media:
        type: nfs
        server: 192.168.1.17
        path: /mnt/oasis/Media
        advancedMounts:
          bookshelf:
            app:
            - path: /media
            sync-kindle:
            - path: /media
              readOnly: true
