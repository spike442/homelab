apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository
    template:
      type: Opaque
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
  - extract:
      key: kopiur
