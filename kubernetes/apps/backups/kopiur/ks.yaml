apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: kopiur
spec:
  dependsOn:
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/backups/kopiur/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: backups
  # Repository bootstrap can run for hours while the NAS catalog is scanned.
  # Do not block the Flux Kustomization health check on that one-shot job.
  wait: false
