apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sensei-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sensei-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: sensei
        password: "{{ .DATABASE_PASSWORD }}"
  data:
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: sensei
      property: DATABASE_PASSWORD
