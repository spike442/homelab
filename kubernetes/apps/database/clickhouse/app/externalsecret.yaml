apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: clickhouse-auth
    template:
      engineVersion: v2
      data:
        ADMIN_PASSWORD: "{{ .password }}"
        accounts.xml: |
          <clickhouse>
            <profiles>
              <default><max_threads>2</max_threads><max_memory_usage>1073741824</max_memory_usage></default>
            </profiles>
            <users>
              <default remove="remove"/>
              <admin>
                <password_sha256_hex>{{ .password | sha256sum }}</password_sha256_hex>
                <networks><ip>0.0.0.0/0</ip><ip>::/0</ip></networks>
                <profile>default</profile><quota>default</quota>
                <access_management>1</access_management>
              </admin>
            </users>
          </clickhouse>
  data:
  - secretKey: password
    remoteRef:
      key: clickhouse
      property: ADMIN_PASSWORD
