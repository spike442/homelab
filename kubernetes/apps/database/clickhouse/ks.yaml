apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse
  namespace: database
spec:
  dependsOn:
  - name: openebs
    namespace: storage
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/database/clickhouse/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  timeout: 10m
  wait: true
