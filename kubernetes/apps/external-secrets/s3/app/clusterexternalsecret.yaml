---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: s3
spec:
  externalSecretName: s3
  namespaceSelectors:
  - matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - agents
      - database
      - datalakehouse
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    target:
      name: s3
      template:
        metadata:
          labels:
            cnpg.io/reload: "true"
        data:
          S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
          S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
    dataFrom:
    - extract:
        key: s3
