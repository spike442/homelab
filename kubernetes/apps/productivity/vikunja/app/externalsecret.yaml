---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vikunja-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_SERVICE_SECRET: "{{ .VIKUNJA_SERVICE_SECRET }}"
  dataFrom:
  - extract:
      key: vikunja
