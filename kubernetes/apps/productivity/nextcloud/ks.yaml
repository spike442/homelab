# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-db
  namespace: productivity
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: onepassword
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/productivity/nextcloud/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
spec:
  dependsOn:
  - name: valkey
    namespace: database
  - name: nextcloud-db
    namespace: productivity
  - name: openebs
    namespace: storage
  - name: kopiur
    namespace: flux-system
  - name: onepassword
    namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/productivity/nextcloud/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  postBuild:
    substitute:
      APP: nextcloud
      BACKUP_UID: "33"
      BACKUP_GID: "33"
  wait: false
