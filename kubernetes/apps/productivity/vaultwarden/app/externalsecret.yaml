---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-db
spec:
  refreshInterval: 1h
  target:
    name: vaultwarden-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: vaultwarden
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://vaultwarden:{{ .password }}@postgres0-rw.database.svc.cluster.local:5432/vaultwarden"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ClusterGenerator
        name: vaultwarden-db-password
