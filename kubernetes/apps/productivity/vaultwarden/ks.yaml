---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
spec:
  dependsOn:
  - name: vaultwarden-db
    namespace: database
  - name: kopiur
    namespace: flux-system
  - name: openebs
    namespace: storage
  interval: 1h
  path: ./kubernetes/apps/productivity/vaultwarden/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  postBuild:
    substitute:
      APP: vaultwarden
  wait: false
